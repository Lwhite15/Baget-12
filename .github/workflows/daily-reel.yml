# Daily Reel: each day shows a different part of Baget (scripts/reels/features.json, rotating by day): a brand-new
# customer's first hunt (asks rotate through scripts/reels/prompts.json), what weeks of scouts hunting produces, the
# friends feature, chatting with a scout, or drops and restocks. The recording is cut into a captioned 1080x1920 Reel on
# the "reels" branch (reels/YYYY-MM-DD.mp4 plus a suggested Instagram caption). GitHub often starts scheduled runs hours
# late, so it is scheduled at 1am Eastern to be ready by morning.
name: Daily reel
on:
  schedule:
    - cron: "7 6 * * *"
    # Backup start in case GitHub drops or badly delays the first one; skipped if today's Reel is already there.
    - cron: "7 8 * * *"
  workflow_dispatch:
    inputs:
      feature:
        description: "Part of the app to show (empty: today's)"
        type: choice
        options: ["", "ask", "longterm", "friends", "chat", "drops"]
        default: ""
      index:
        description: "Prompt number to use for the ask/chat reels (empty: today's)"
        default: ""
      name:
        description: "File name suffix, for a test Reel that must not replace today's (e.g. test → YYYY-MM-DD-test.mp4)"
        default: ""
permissions:
  contents: write
concurrency:
  group: daily-reel
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          D=$(date -u +%F)
          if [ "${{ github.event_name }}" = schedule ] && git ls-remote --exit-code https://github.com/${{ github.repository }} reels >/dev/null \
             && curl -fsI "https://raw.githubusercontent.com/${{ github.repository }}/reels/reels/$D.mp4" >/dev/null; then
            echo "::notice::Today's Reel is already there; nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
  record:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BAGET_CRON_SECRET: ${{ secrets.BAGET_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Pick today's feature
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT/qa"
          python3 - "$OUT/qa/prompt.json" "${{ inputs.feature }}" "${{ inputs.index }}" <<'PY'
          import json, sys, datetime
          F = json.load(open("scripts/reels/features.json"))
          day = datetime.datetime.utcnow().date()
          n = day.toordinal()
          mode = sys.argv[2].strip() or F["rotation"][n % len(F["rotation"])]
          i = int(sys.argv[3]) if sys.argv[3].strip() else n // len(F["rotation"])
          if mode == "ask":
              ps = json.load(open("scripts/reels/prompts.json")); p = dict(ps[i % len(ps)], index=i % len(ps))
          elif mode == "chat":
              p = dict(F["chat"][i % len(F["chat"])], index=i % len(F["chat"]))
          else:
              p = {}
          p.update(mode=mode, date=day.isoformat())
          json.dump(p, open(sys.argv[1], "w"))
          print(f"::notice::Today's Reel: {mode} {p.get('prompt', '')}")
          PY
          echo "FEATURE=$(jq -r .mode "$OUT/qa/prompt.json")" >> "$GITHUB_ENV"
      - name: Use Xcode 27 (iOS 27.1 SDK for iPhone Duo)
        run: bash scripts/use-xcode.sh
      - name: Build
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          set -o pipefail
          xcodebuild build-for-testing -project Baget.xcodeproj -scheme BagetQA -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO BAGET_DUO_FLAG="$BAGET_DUO_FLAG" \
            BAGET_SUPABASE_URL="https://${PROJECT_REF}.supabase.co" BAGET_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" > build.log 2>&1 \
            || { grep -E ": error: " build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Fill the demo account
        if: env.FEATURE != 'ask'
        run: |
          pip3 install -q bcrypt --break-system-packages 2>/dev/null || pip3 install -q bcrypt
          pw=$(python3 -c "import secrets,string; print('Shot-' + ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(20)))")
          echo "::add-mask::$pw"
          hash=$(PW="$pw" python3 -c "import bcrypt,os; print(bcrypt.hashpw(os.environ['PW'].encode(), bcrypt.gensalt(10)).decode())")
          echo "::add-mask::$hash"
          echo "SHOT_PW=$pw" >> "$GITHUB_ENV"
          body=$(jq -nc --arg h "$hash" '{shots: {password_hash: $h, keep: true}}')
          r=$(curl -sS -m 120 -w ' [HTTP %{http_code}]' -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/sweep" \
                -H "Content-Type: application/json" -H "x-baget-secret: ${BAGET_CRON_SECRET}" -d "$body")
          echo "::notice::account: $r"
          echo "$r" | grep -q 'HTTP 200' || exit 1
      - name: Record the demo
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          devs=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          pick=next((x for x in devs if x["name"].endswith("Pro")), None) or devs[0]
          print(pick["udid"])')
          echo "::notice::Device: $(xcrun simctl list devices | grep "$UDID" | sed 's/^ *//')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          OUT="$RUNNER_TEMP/out"
          if [ "$FEATURE" = ask ]; then
            pw=$(python3 -c "import secrets,string; print('Qa-' + ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(20)))")
            echo "::add-mask::$pw"
            email="reel-${GITHUB_RUN_ID}@example.com"
            r=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://${PROJECT_REF}.supabase.co/auth/v1/signup" -H "apikey: ${SUPABASE_ANON_KEY}" \
                  -H "Content-Type: application/json" -d "$(jq -nc --arg e "$email" --arg p "$pw" '{email:$e,password:$p,data:{full_name:"Maya"}}')")
            echo "::notice::sign-up HTTP $r ($email)"
            export TEST_RUNNER_QA_PILL="$(jq -r .pill "$OUT/qa/prompt.json")" TEST_RUNNER_QA_PROMPT="$(jq -r .prompt "$OUT/qa/prompt.json")" TEST_RUNNER_QA_FOLLOWUP="$(jq -r .followUp "$OUT/qa/prompt.json")"
            export TEST_RUNNER_QA_EMAIL="$email" TEST_RUNNER_QA_PASSWORD="$pw" TEST_RUNNER_QA_DEMO=1
            TEST=testDemoReel
          else
            export TEST_RUNNER_QA_SHOT_EMAIL="screenshots@example.com" TEST_RUNNER_QA_SHOT_PASSWORD="$SHOT_PW" TEST_RUNNER_QA_FEATURE="$FEATURE"
            [ "$FEATURE" = chat ] && export TEST_RUNNER_QA_PROMPT="$(jq -r .prompt "$OUT/qa/prompt.json")"
            case "$FEATURE" in
              longterm) export TEST_RUNNER_QA_LONGTERM=1; TEST=testLongTermReel ;;
              friends) TEST=testFriendsReel ;;
              chat) TEST=testChatReel ;;
              drops) TEST=testDropsReel ;;
            esac
          fi
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/qa/demo.mp4" > "$OUT/rec.log" 2>&1 &
          REC=$!
          sleep 3
          python3 -c "import time; print('REC_START %.2f' % time.time())" > "$OUT/qa/rec_start.txt"
          TEST_RUNNER_QA_OUT="$OUT" \
            xcodebuild test-without-building -only-testing:BagetUITests/QAWalkthrough/$TEST -project Baget.xcodeproj -scheme BagetQA -derivedDataPath build \
            -destination "id=$UDID" -resultBundlePath "$RUNNER_TEMP/demo.xcresult" > test.log 2>&1 || echo "::warning::The demo script reported failures (see steps.txt)"
          if [ "$FEATURE" = ask ]; then
            # Clean up: delete the test account the way a person would (the app's Delete account path).
            tok=$(curl -sS -X POST "https://${PROJECT_REF}.supabase.co/auth/v1/token?grant_type=password" -H "apikey: ${SUPABASE_ANON_KEY}" \
                  -H "Content-Type: application/json" -d "$(jq -nc --arg e "$email" --arg p "$pw" '{email:$e,password:$p}')" | jq -r '.access_token // empty')
            if [ -n "$tok" ]; then
              curl -sS -o /dev/null -w "::notice::Test account deleted (HTTP %{http_code})\n" -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/delete-account" \
                -H "Authorization: Bearer $tok" -H "apikey: ${SUPABASE_ANON_KEY}" -H "Content-Type: application/json" -d '{}' || true
            fi
          fi
          kill -INT $REC; wait $REC || true
          cat "$OUT/rec.log" | tail -3
          grep "QA: " test.log | sed 's/.*QA: //' | tail -80
          [ -f "$OUT/qa/steps.txt" ] || grep "QA: " test.log | sed 's/.*QA: //' > "$OUT/qa/steps.txt"
          ls -la "$OUT/qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: ${{ runner.temp }}/out/qa
          retention-days: 7
  cut:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: demo
          path: raw
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg tesseract-ocr fonts-inter >/dev/null
          pip install -q pillow
      - name: Cut the Reel
        run: |
          D=$(jq -r .date raw/prompt.json)${{ inputs.name && format('-{0}', inputs.name) || '' }}
          mkdir -p out && python3 scripts/reels/cut.py raw/demo.mp4 raw/prompt.json "out/$D.mp4" "out/$D.txt"
          echo "::notice::Reel $D: $(jq -r '.mode + " " + (.hook // "")' raw/prompt.json) ($(ffprobe -v error -show_entries format=duration -of csv=p=0 out/$D.mp4)s)"
      - name: Put it on the reels branch
        run: |
          git config user.name "Baget reels"; git config user.email "reels@users.noreply.github.com"
          if git fetch -q origin reels 2>/dev/null; then git checkout -q -B reels origin/reels; else git checkout -q --orphan reels && git rm -rfq . ; fi
          mkdir -p reels && cp out/* reels/
          # Keep two weeks.
          ls reels/*.mp4 | sort | head -n -14 | while read f; do git rm -q "$f" "${f%.mp4}.txt" 2>/dev/null || rm -f "$f"; done
          git add reels && git commit -qm "Reel $(ls out/*.mp4 | xargs -n1 basename)" && git push -q origin HEAD:reels
