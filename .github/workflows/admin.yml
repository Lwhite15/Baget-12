# Gives an account access to the Stats screen. Pass the SHA-256 of the account's email (never the email itself;
# this repo is public), or "earliest" for the first real account ever created. Prints counts only.
name: Admin access
on:
  workflow_dispatch:
    inputs:
      who:
        description: "sha256 hex of the account email, or 'earliest'"
        required: true
jobs:
  grant:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      WHO: ${{ inputs.who }}
    steps:
      - name: Grant
        run: |
          q() { curl -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
                  -d "$(jq -nc --arg q "$1" '{query: $q}')"; }
          if [ "$WHO" = "earliest" ]; then
            pick="select id from public.profiles where id <> '0a99e1e0-5eed-4d3e-8a00-00000000d3e0' order by created_at limit 1"
          elif echo "$WHO" | grep -Eq '^[0-9a-f]{64}$'; then
            pick="select id from auth.users where encode(sha256(convert_to(lower(email), 'UTF8')), 'hex') = '$WHO'"
          else
            echo "::error::Pass a 64-character sha256 hex or 'earliest'"; exit 1
          fi
          echo "::notice::grant: $(q "with g as (insert into public.app_admins (user_id) $pick on conflict do nothing returning 1) select (select count(*) from g) as added, (select count(*) from public.app_admins) as admins")"
