# Adds the free trial (introductory offer) to the Baget Pro subscriptions in App Store Connect.
name: Pro free trial
on:
  workflow_dispatch:
    inputs:
      trial:
        description: "Trial length (THREE_DAYS, ONE_WEEK, TWO_WEEKS, ONE_MONTH)"
        default: ONE_WEEK
permissions:
  contents: read
jobs:
  offer:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TRIAL: ${{ inputs.trial }}
    steps:
      - uses: actions/checkout@v5
      - name: Write key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN"; then printf '%s\n' "$ASC_KEY_P8_BASE64" > "$RUNNER_TEMP/keys/k.p8"
          else echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/k.p8"; fi
          chmod 600 "$RUNNER_TEMP/keys/k.p8"
      - name: Add the trial
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/k.p8
        run: |
          pip install -q pyjwt cryptography requests
          python3 scripts/intro_offer.py
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
