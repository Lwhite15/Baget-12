# Builds Baget in the cloud. No Mac needed.
#
#  * "check" runs on every push: compiles the app for the simulator, no Apple account needed.
#    Use it to confirm the code builds.
#  * "testflight" runs when you start it by hand (Actions tab > iOS > Run workflow):
#    builds, signs and uploads to TestFlight, then you install it on your iPhone from the TestFlight app.
#    Needs the secrets listed in README.md.
name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ["supabase/**", "README.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight"
        type: boolean
        default: true

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$X"
          echo "::notice::Using $(xcodebuild -version | tr '\n' ' ')"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Baget.xcodeproj -scheme Baget -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          # Surface compile errors as annotations, readable from the API without downloading logs.
          { grep -E "^/.*: error: " build.log || true; } | sed -E 's#^.*/Baget/##' | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::notice::$(grep -cE ': warning: ' build.log || true) compiler warnings; $(grep -c 'BUILD SUCCEEDED' build.log || true) BUILD SUCCEEDED"
          grep -q "BUILD SUCCEEDED" build.log
      - name: Launch test on the simulator
        run: |
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/Baget.app | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl install "$UDID" "$APP"
          mkdir -p crashes && touch crashes/.start
          xcrun simctl launch "$UDID" "$BUNDLE" -BagetSmokeTest
          sleep 30
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          IPS=$(find "$HOME/Library/Logs/DiagnosticReports" -name "Baget*.ips" -newer crashes/.start 2>/dev/null | head -1)
          if [ -n "$IPS" ]; then
            echo "::error::Baget crashed on launch in the simulator"
            python3 - "$IPS" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read().split("\n", 1)
          body = json.loads(raw[1]) if len(raw) > 1 else {}
          ex = body.get("exception", {})
          print(f"::error::Exception: {ex.get('type')} {ex.get('signal')} {body.get('termination', {}).get('indicator', '')}")
          imgs = body.get("usedImages", [])
          for t in body.get("threads", []):
              if t.get("triggered"):
                  for f in t.get("frames", [])[:25]:
                      img = imgs[f.get("imageIndex", 0)].get("name", "?") if imgs else "?"
                      sym = f.get("symbol", "?")
                      loc = f" {f.get('sourceFile')}:{f.get('sourceLine')}" if f.get("sourceFile") else ""
                      print(f"::error::{img} {sym}{loc}")
          PY
            exit 1
          fi
          if [ ! -f "$DATA/Documents/smoke-ok" ]; then echo "::error::The launch test didn't finish (no crash report found)"; exit 1; fi
          echo "::notice::Launch test passed: every tab and sheet opened, including a find with no price"
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: check
    runs-on: macos-26
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$X"
          echo "::notice::Using $(xcodebuild -version | tr '\n' ' ')"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Accept the key as raw .p8 text or as base64.
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$RUNNER_TEMP/keys/AuthKey.p8"
          else
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          fi
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
          # Shape checks only; never print values.
          head -1 "$RUNNER_TEMP/keys/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" || echo "::error::ASC_KEY_P8_BASE64 doesn't look like a .p8 key (no BEGIN PRIVATE KEY line after decoding)."
          [ ${#TEAM_ID} -eq 10 ] || echo "::error::APPLE_TEAM_ID should be 10 characters; it is ${#TEAM_ID}."
          [ ${#ASC_KEY_ID} -eq 10 ] || echo "::error::ASC_KEY_ID should be 10 characters; it is ${#ASC_KEY_ID}."
          [ ${#ASC_ISSUER_ID} -eq 36 ] || echo "::error::ASC_ISSUER_ID should be a 36-character ID like 69a6de7e-...; it is ${#ASC_ISSUER_ID}."
          case "$BUNDLE_ID" in *" "*|"") echo "::error::BUNDLE_ID is empty or has spaces.";; esac
      - name: Archive
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          # The app talks to https://<project-ref>.supabase.co. Without these secrets it runs with sample data only.
          SUPABASE_URL=""
          if [ -n "$PROJECT_REF" ] && [ -n "$SUPABASE_ANON_KEY" ]; then SUPABASE_URL="https://${PROJECT_REF}.supabase.co"; fi
          xcodebuild archive \
            -project Baget.xcodeproj -scheme Baget -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Baget.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            BAGET_SUPABASE_URL="$SUPABASE_URL" \
            BAGET_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" > archive.log 2>&1 || {
              { grep -E "error:|Error Domain|No profiles|No Account|not available|Provisioning|requires a provisioning|signing" archive.log || true; } \
                | grep -v "^ *export " | sort -u | head -25 | while IFS= read -r line; do echo "::error::${line}"; done
              tail -n 60 archive.log
              exit 65
            }
          tail -n 20 archive.log
          # The archive is unsigned, so carry the app's capabilities in with a placeholder signature.
          # The export then signs for distribution and keeps Sign in with Apple and push.
          APP="$RUNNER_TEMP/Baget.xcarchive/Products/Applications/Baget.app"
          sed 's#<string>development</string>#<string>production</string>#' Baget/Baget.entitlements > "$RUNNER_TEMP/dist.entitlements"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/dist.entitlements" --timestamp=none "$APP"
          echo "::notice::Archive entitlements: $(codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -o '<key>[^<]*</key>' | sed 's/<[^>]*>//g' | tr '\n' ' ')"
      - name: Sign for distribution
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Baget.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 || {
              { grep -E "error:|Error Domain|failed|Failed|not available|Provisioning" export.log || true; } \
                | sort -u | head -25 | while IFS= read -r line; do echo "::error::${line}"; done
              tail -n 60 export.log
              exit 1
            }
          tail -n 10 export.log
      - name: Check the signed app
        run: |
          # Sign in with Apple and push must survive signing, or the app can't log in or text you.
          cd "$RUNNER_TEMP/export"
          IPA=$(ls *.ipa | head -1)
          unzip -q -o "$IPA" -d ipa
          codesign -d --entitlements - --xml ipa/Payload/*.app > ents.plist 2>/dev/null || true
          echo "::notice::Signed build entitlements: $(grep -o '<key>[^<]*</key>' ents.plist | sed 's/<[^>]*>//g' | tr '\n' ' ')"
          grep -q "com.apple.developer.applesignin" ents.plist || { echo "::error::Signed build is missing Sign in with Apple. Is it ticked on the App ID?"; exit 1; }
          grep -q "aps-environment" ents.plist || { echo "::error::Signed build is missing push notifications. Is it ticked on the App ID?"; exit 1; }
          grep -A1 "aps-environment" ents.plist | grep -q production || echo "::warning::Push environment isn't production."
      - name: Upload to TestFlight
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/keys/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > upload.log 2>&1 || {
              { grep -E "ERROR|error|Error" upload.log || true; } | sort -u | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
              tail -n 40 upload.log
              rm -rf "$RUNNER_TEMP/private_keys"
              exit 1
            }
          rm -rf "$RUNNER_TEMP/private_keys"
          tail -n 10 upload.log
          echo "::notice::Uploaded build ${{ github.run_number }} to TestFlight"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/private_keys"
