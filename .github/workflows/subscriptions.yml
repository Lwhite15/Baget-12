# Sets up Baget Pro in App Store Connect (subscription group, monthly and yearly plans, prices, availability,
# server notifications). Safe to re-run. Prints statuses only.
name: Subscriptions
on:
  workflow_dispatch:
    inputs:
      monthly:
        description: "US monthly price"
        default: "7.99"
      yearly:
        description: "US yearly price"
        default: "59.99"
permissions:
  actions: read
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      MONTHLY: ${{ inputs.monthly }}
      YEARLY: ${{ inputs.yearly }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Write key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN"; then printf '%s\n' "$ASC_KEY_P8_BASE64" > "$RUNNER_TEMP/keys/k.p8"
          else echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/k.p8"; fi
          chmod 600 "$RUNNER_TEMP/keys/k.p8"
      - name: Get the paywall screenshot from the latest iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w iOS -L 15 --json databaseId,conclusion -q '.[] | select(.conclusion=="success") | .databaseId'); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n paywall-shot -D "$RUNNER_TEMP/shot" 2>/dev/null && break
          done
          ls "$RUNNER_TEMP/shot" 2>/dev/null || echo "no screenshot yet"
      - name: Set up Baget Pro
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/k.p8
        run: |
          pip install -q pyjwt cryptography requests
          SHOT="$RUNNER_TEMP/shot/paywall.png" NOTIFY_URL="https://${PROJECT_REF}.supabase.co/functions/v1/subscription" python3 scripts/subscriptions.py
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
