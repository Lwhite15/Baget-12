# Builds the Android app in the cloud. No Android Studio needed.
#
#  * "build" runs when Android code changes: compiles the app and keeps the installable APK as a workflow artifact.
#  * "launch-test" boots an Android emulator, installs the APK and checks the app opens and runs without crashing.
#  * Google Play uploads are never automatic: they happen only when Larry says to publish a build.
#
# Secrets it uses (all optional; without them the app builds and runs with sample data):
#   SUPABASE_PROJECT_REF, SUPABASE_ANON_KEY   the same ones the iPhone build uses
#   GOOGLE_WEB_CLIENT_ID                      turns on "Continue with Google"
#   GOOGLE_SERVICES_JSON                      Firebase config (base64 or raw JSON), turns on push notifications
#   ANDROID_SIGNING                           the signing key bundle (one line of text), so every build is signed the same way
name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      BAGET_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::notice::No GOOGLE_SERVICES_JSON secret: building without push notifications."; exit 0; fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json; fi
          python3 -c 'import json; d=json.load(open("app/google-services.json")); print("::notice::Firebase project:", d["project_info"]["project_id"], "· packages:", ", ".join(c["client_info"]["android_client_info"]["package_name"] for c in d["client"]))'
      - name: Signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          if [ -z "$ANDROID_SIGNING" ]; then echo "::warning::No ANDROID_SIGNING secret: this build uses a throwaway key, so it can't update an earlier install and Google sign-in won't work on it."; exit 0; fi
          printf '%s' "$ANDROID_SIGNING" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/signing.json"
          python3 - "$RUNNER_TEMP/signing.json" "$RUNNER_TEMP/baget.p12" <<'PY'
          import base64, json, sys
          d = json.load(open(sys.argv[1]))
          open(sys.argv[2], "wb").write(base64.b64decode(d["keystore"]))
          print("::add-mask::" + d["password"])
          import os
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ANDROID_KEYSTORE_FILE={sys.argv[2]}\nANDROID_KEYSTORE_PASSWORD={d['password']}\nANDROID_KEY_ALIAS={d.get('alias', 'baget')}\n")
          PY
          rm -f "$RUNNER_TEMP/signing.json"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log | grep -E "^e: |error:|FAILURE|BUILD (SUCCESSFUL|FAILED)" || true
          # Surface Kotlin compile errors as annotations, readable from the API without downloading logs.
          { grep -E "^e: " build.log || true; } | sed -E 's#^e: file://.*/app/src/main/java/app/baget/#e: #' | sort -u | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          grep -q "BUILD SUCCESSFUL" build.log
      - name: Signing check
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SHA1=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-1 digest" | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-z A-Z)
          echo "::notice::Signing certificate SHA-1 (for Google sign-in and Firebase): $SHA1"
          echo "::notice::APK size: $(du -h "$APK" | cut -f1)"
          mkdir -p out && cp "$APK" "out/Baget-${{ github.run_number }}.apk" && cp app/build/outputs/bundle/release/app-release.aab "out/Baget-${{ github.run_number }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: baget-android
          path: android/out/
          retention-days: 30
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log

  launch-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baget-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Image tools
        run: pip install --quiet pillow
      - name: Write the launch test
        run: |
          cat > launch.sh <<'SH'
          set -e
          APK=$(ls apk/*.apk | head -1)
          PKG=app.baget
          mkdir -p shots
          crashed() {
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              adb logcat -d | grep -A40 "FATAL EXCEPTION" | head -60 | sed 's/^/::error::/'
              exit 1
            fi
            adb shell pidof "$PKG" >/dev/null || { echo "::error::Baget stopped running ($1)"; exit 1; }
          }
          shot() {   # a small screenshot, posted as a notice so it can be looked at without downloading anything
            adb shell screencap -p /sdcard/shot.png && adb pull /sdcard/shot.png "shots/$1.png" >/dev/null
            python3 -c "import sys; from PIL import Image; i=Image.open(sys.argv[1]).convert('RGB'); i.thumbnail((300,1000)); i.save(sys.argv[2], quality=45)" "shots/$1.png" "shots/$1.jpg"
          }
          go() { adb shell am start -n "$PKG/app.baget.MainActivity" --es go "$1" >/dev/null; sleep 4; crashed "$1"; shot "$2"; }
          adb install -r "$APK"
          adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          adb shell am start -W -n "$PKG/app.baget.MainActivity"
          sleep 12; crashed launch; shot welcome
          go tour today
          go finds finds
          go squad squad
          go friends friends
          go sheet:swipe swipe
          go sheet:inbox inbox
          go sheet:profile profile
          go sheet:deploy deploy
          go sheet:taste taste
          go sheet:checkout checkout
          go sheet:customize customize
          go sheet:pro pro
          go close live
          echo "::notice::Launch test passed: Baget opened, the sample tour ran, and every tab and sheet opened"
          SH
      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash launch.sh
      - name: Publish the screenshots to the android-shots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots && rm -f *.png && git init -q && git checkout -q -b android-shots
          git -c user.name="Baget CI" -c user.email="ci@baget.invalid" add . && git -c user.name="Baget CI" -c user.email="ci@baget.invalid" commit -qm "Launch test screenshots, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-shots
      - name: Keep the launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-shots
          path: shots/
          if-no-files-found: ignore
