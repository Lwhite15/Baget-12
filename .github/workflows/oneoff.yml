# One-off maintenance: undo the taste a diagnostic chat test taught every agent. Removed after use.
name: Oneoff
on:
  workflow_dispatch:
jobs:
  undo:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - run: |
          q() { curl -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
                  -d "$(jq -n --arg q "$1" '{query:$q}')"; }
          P="(earth|natural material|natural fib|natural fab)"
          q "select name, (select array_agg(t) from unnest(traits || keywords) t where t ~* '$P') as added from public.agents" | jq -c '.[]' | sed 's/^/::notice::before /'
          q "update public.agents set
               traits = coalesce((select array_agg(t) from unnest(traits) t where t !~* '$P'), '{}'),
               keywords = coalesce((select array_agg(t) from unnest(keywords) t where t !~* '$P'), '{}'),
               learned = coalesce((select jsonb_object_agg(k, v) from jsonb_each(learned) e(k, v) where k !~* '$P'), '{}'::jsonb)
             where exists (select 1 from unnest(traits || keywords) t where t ~* '$P') or exists (select 1 from jsonb_object_keys(learned) k where k ~* '$P')
             returning name" | jq -c . | sed 's/^/::notice::cleaned /'
          q "select count(*) as left_over from public.agents where exists (select 1 from unnest(traits || keywords) t where t ~* '$P')" | jq -c . | sed 's/^/::notice::after /'
