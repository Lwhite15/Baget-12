# Long-term Reel: the demo account that has had scouts hunting every day for weeks (Today, the scouts, weeks of texts,
# thousands of finds, one up close), cut into a captioned Reel on the "reels" branch as reels/YYYY-MM-DD-longterm.mp4.
name: Long-term reel
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days the scouts have been hunting (for the caption)"
        default: ""
      finds:
        description: "Finds so far (for the caption)"
        default: ""
permissions:
  contents: write
jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BAGET_CRON_SECRET: ${{ secrets.BAGET_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 27 (iOS 27.1 SDK for iPhone Duo)
        run: bash scripts/use-xcode.sh
      - name: Build
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          set -o pipefail
          xcodebuild build-for-testing -project Baget.xcodeproj -scheme BagetQA -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO BAGET_DUO_FLAG="$BAGET_DUO_FLAG" \
            BAGET_SUPABASE_URL="https://${PROJECT_REF}.supabase.co" BAGET_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" > build.log 2>&1 \
            || { grep -E ": error: " build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Fill the screenshots account
        run: |
          pip3 install -q bcrypt --break-system-packages 2>/dev/null || pip3 install -q bcrypt
          pw=$(python3 -c "import secrets,string; print('Shot-' + ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(20)))")
          echo "::add-mask::$pw"
          hash=$(PW="$pw" python3 -c "import bcrypt,os; print(bcrypt.hashpw(os.environ['PW'].encode(), bcrypt.gensalt(10)).decode())")
          echo "::add-mask::$hash"
          echo "SHOT_PW=$pw" >> "$GITHUB_ENV"
          body=$(jq -nc --arg h "$hash" '{shots: {password_hash: $h, keep: true}}')
          r=$(curl -sS -m 120 -w ' [HTTP %{http_code}]' -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/sweep" \
                -H "Content-Type: application/json" -H "x-baget-secret: ${BAGET_CRON_SECRET}" -d "$body")
          echo "::notice::account: $r"
          echo "$r" | grep -q 'HTTP 200' || exit 1
      - name: Record the demo
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          devs=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          pick=next((x for x in devs if x["name"].endswith("Pro")), None) or devs[0]
          print(pick["udid"])')
          echo "::notice::Device: $(xcrun simctl list devices | grep "$UDID" | sed 's/^ *//')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT/qa"
          jq -nc --arg d "${{ inputs.days }}" --arg f "${{ inputs.finds }}" '{mode:"longterm", date:(now|strftime("%Y-%m-%d")), days:($d|tonumber? // null), finds:($f|tonumber? // null)}' > "$OUT/qa/prompt.json"
          cat "$OUT/qa/prompt.json"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/qa/demo.mp4" > "$OUT/rec.log" 2>&1 &
          REC=$!
          sleep 3
          python3 -c "import time; print('REC_START %.2f' % time.time())" > "$OUT/qa/rec_start.txt"
          TEST_RUNNER_QA_SHOT_EMAIL="screenshots@example.com" TEST_RUNNER_QA_SHOT_PASSWORD="$SHOT_PW" TEST_RUNNER_QA_OUT="$OUT" TEST_RUNNER_QA_LONGTERM=1 \
            xcodebuild test-without-building -only-testing:BagetUITests/QAWalkthrough/testLongTermReel -project Baget.xcodeproj -scheme BagetQA -derivedDataPath build \
            -destination "id=$UDID" -resultBundlePath "$RUNNER_TEMP/demo.xcresult" > test.log 2>&1 || echo "::warning::The demo script reported failures (see steps.txt)"
          kill -INT $REC; wait $REC || true
          cat "$OUT/rec.log" | tail -3
          grep "QA: " test.log | sed 's/.*QA: //' | tail -80
          [ -f "$OUT/qa/steps.txt" ] || grep "QA: " test.log | sed 's/.*QA: //' > "$OUT/qa/steps.txt"
          ls -la "$OUT/qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: ${{ runner.temp }}/out/qa
          retention-days: 7
  cut:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: demo
          path: raw
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg tesseract-ocr fonts-inter >/dev/null
          pip install -q pillow
      - name: Cut the Reel
        run: |
          D=$(jq -r .date raw/prompt.json)
          mkdir -p out && python3 scripts/reels/cut.py raw/demo.mp4 raw/prompt.json "out/$D-longterm.mp4" "out/$D-longterm.txt"
          echo "::notice::Long-term reel $D ($(ffprobe -v error -show_entries format=duration -of csv=p=0 out/$D-longterm.mp4)s)"
      - name: Put it on the reels branch
        run: |
          git config user.name "Baget reels"; git config user.email "reels@users.noreply.github.com"
          if git fetch -q origin reels 2>/dev/null; then git checkout -q -B reels origin/reels; else git checkout -q --orphan reels && git rm -rfq . ; fi
          mkdir -p reels && cp out/* reels/
          # Keep two weeks.
          ls reels/*.mp4 | sort | head -n -20 | while read f; do git rm -q "$f" "${f%.mp4}.txt" 2>/dev/null || rm -f "$f"; done
          git add reels && git commit -qm "Reel $(ls out/*.mp4 | xargs -n1 basename)" && git push -q origin HEAD:reels
