# Submits version 1.0 for App Review (the real App Store, not TestFlight). Only when Larry says to submit.
name: Submit for App Review
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number that must be attached"
        required: true
      video_link:
        description: "Screen recording link: puts docs/review-notes.txt into the App Review notes first (optional)"
        default: ""
      attach_build:
        description: "Attach this build number first (optional)"
        default: ""
      cancel_first:
        description: "Pull a waiting submission back first (to add the subscriptions)"
        type: boolean
        default: false
      require_subs:
        description: "Don't submit unless the Pro subscriptions go with it"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      EXPECT_BUILD: ${{ inputs.build }}
      ATTACH_BUILD: ${{ inputs.attach_build }}
      CANCEL_FIRST: ${{ inputs.cancel_first && '1' || '' }}
      REQUIRE_SUBS: ${{ inputs.require_subs && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Write key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN"; then printf '%s\n' "$ASC_KEY_P8_BASE64" > "$RUNNER_TEMP/keys/k.p8"
          else echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/k.p8"; fi
          chmod 600 "$RUNNER_TEMP/keys/k.p8"
      - name: Submit
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/k.p8
          VIDEO_LINK: ${{ inputs.video_link }}
        run: |
          pip install -q pyjwt cryptography requests
          if [ -n "$VIDEO_LINK" ]; then python3 scripts/review_notes.py; fi
          python3 scripts/submit_review.py
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
