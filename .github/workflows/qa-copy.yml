# Copies a QA walkthrough's screenshots onto the "qa" branch so they can be reviewed without downloading artifacts.
# Only the test account (qa-…@example.com) appears in them.
name: QA copy
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "QA walkthrough run ID"
        required: true
permissions:
  actions: read
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n qa -D qa
          cd qa && git init -q && git checkout -q -b qa && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "QA walkthrough $RUN"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:qa
