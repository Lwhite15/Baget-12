# XcodeGen project definition. `xcodegen generate` turns this into Baget.xcodeproj.
# The cloud build does that for you; on a Mac, run: brew install xcodegen && xcodegen generate
name: Baget
options:
  bundleIdPrefix: app.baget
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer Team ID (10 characters). The cloud build fills this in from a secret.
    DEVELOPMENT_TEAM: ""
    # Your Supabase project (URL and the public anon or publishable key). Leave empty and the app runs
    # with sample data only. The cloud build fills these in from secrets.
    BAGET_SUPABASE_URL: ""
    BAGET_SUPABASE_ANON_KEY: ""
    # The app's bundle ID. The notification extension is this plus ".notify". The cloud build fills it in.
    BAGET_BUNDLE_ID: app.baget.ios
    # Swift strings (Text, String(localized:)) are extracted into Localizable.xcstrings for translation.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Baget:
    type: application
    platform: iOS
    sources:
      - path: Baget
    dependencies:
      - target: BagetNotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BAGET_BUNDLE_ID)
        PRODUCT_NAME: Baget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Baget/Baget.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Xcode switches this to "production" when it exports for TestFlight and the App Store.
        aps-environment: development
    info:
      path: Baget/Info.plist
      properties:
        CFBundleDisplayName: Baget
        # The app's languages (Localizable.xcstrings). iOS shows a Language choice for Baget in Settings.
        CFBundleLocalizations: [en, es, fr, ko]
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Background sweeps: iOS wakes the app to run them.
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - app.baget.sweep
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Snap something you love so your scouts can learn your style."
        NSPhotoLibraryUsageDescription: "Choose photos of things you love so your scouts can learn your style."
        BagetSupabaseURL: $(BAGET_SUPABASE_URL)
        BagetSupabaseAnonKey: $(BAGET_SUPABASE_ANON_KEY)
    scheme:
      gatherCoverageData: false

  # Adds the product photo to find notifications.
  BagetNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: BagetNotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BAGET_BUNDLE_ID).notify
        PRODUCT_NAME: BagetNotify
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: BagetNotify/Info.plist
      properties:
        CFBundleDisplayName: Baget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # The QA walkthrough (UI test). Only the "QA walkthrough" workflow builds it; never part of an App Store build.
  BagetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BagetUITests
    dependencies:
      - target: Baget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.baget.qa
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Baget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

schemes:
  BagetQA:
    build:
      targets:
        Baget: all
        BagetUITests: [test]
    test:
      config: Debug
      targets:
        - BagetUITests

